name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # setup-python still publishes Python 3.9 binaries for this runner.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install -e ".[dev]" pytest==8.3.5 ruff==0.9.10
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

