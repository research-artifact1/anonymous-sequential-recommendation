[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trimrec"
version = "1.0.0"
description = "Trajectory-aware retrieval with candidate-conditioned multimodal refinement"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TRIMRec Authors"}]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "torch>=2.1",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]
clip = [
  "open-clip-torch>=2.24",
  "Pillow>=9.5",
]

[project.scripts]
trimrec = "trimrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
